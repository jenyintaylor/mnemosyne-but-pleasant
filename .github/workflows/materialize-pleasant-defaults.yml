name: Materialize pleasant defaults
on:
  push:
    branches: [fix/contained-storage-no-local-llm]
    paths:
      - scripts/apply_pleasant_defaults.py
permissions:
  contents: write
concurrency:
  group: pleasant-defaults-materialization
  cancel-in-progress: false
jobs:
  patch-and-test:
    if: github.repository == 'jenyintaylor/mnemosyne-but-pleasant'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/contained-storage-no-local-llm
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply checked source edits
        run: python scripts/apply_pleasant_defaults.py
      - name: Install test dependencies without local models
        run: python -m pip install -e . pytest pytest-timeout numpy httpx sqlite-vec
      - name: Test storage and no-local-LLM contracts
        env:
          MNEMOSYNE_NO_EMBEDDINGS: '1'
        run: python -m pytest -q tests/test_pleasant_defaults.py
      - name: Check syntax and whitespace
        run: |
          python -m compileall -q mnemosyne hermes_memory_provider integrations/hermes/src
          git diff --check
      - name: Commit source edits to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mnemosyne hermes_memory_provider integrations/hermes/src
          if ! git diff --cached --quiet; then
            git commit -m 'fix: contain Mnemosyne storage and require local LLM opt-in'
            git push origin HEAD:refs/heads/fix/contained-storage-no-local-llm
          fi
